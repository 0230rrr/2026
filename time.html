<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月庭 · 時間與任務</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --champagne: #D4AF37;
            --champagne-line: rgba(212, 175, 55, 0.35);
            --warm-beige: #E4D9C8;
            --brown: #2C2825;
            --brown-soft: #6B6358;
            --brown-mute: #A89B88;
            --red: #C0392B;
        }

        body {
            font-family: 'Noto Sans TC', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
            background: #E8E4DE;
            color: var(--brown);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 15% 20%, rgba(123, 168, 160, 0.55) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 25%, rgba(140, 180, 175, 0.45) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 85%, rgba(100, 150, 160, 0.35) 0%, transparent 55%),
                linear-gradient(165deg, #C8C0B4 0%, #D9D2C6 25%, #CFD8D4 55%, #C0CCC8 80%, #B8C4C0 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: -15%; left: 5%;
            width: 70%; height: 70%;
            background: radial-gradient(ellipse at 45% 25%, rgba(255, 250, 235, 0.5) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        .app {
            display: grid;
            grid-template-columns: 220px 1fr;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .sidebar {
            padding: 2.5rem 1.2rem 2rem 2rem;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .brand { margin-bottom: 2.5rem; }

        .brand .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'Noto Serif TC', 'Georgia', serif;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            color: var(--brown);
        }

        .brand .logo .moon-icon {
            font-size: 1.2rem;
            color: var(--champagne);
            filter: drop-shadow(0 1px 3px rgba(212, 175, 55, 0.5));
        }

        .brand .tagline {
            font-size: 0.6rem;
            letter-spacing: 0.35em;
            color: var(--brown-mute);
            margin-top: 0.4rem;
            padding-left: 2px;
        }

        .nav-group { margin-bottom: 1.4rem; }

        .nav-group-label {
            font-size: 0.55rem;
            letter-spacing: 0.35em;
            color: var(--brown-mute);
            margin-bottom: 0.4rem;
            padding-left: 0.9rem;
        }

        .nav-item {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: var(--brown-mute);
            padding: 0.6rem 0 0.6rem 0.9rem;
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
            border: none;
            background: transparent;
            text-align: left;
            font-family: inherit;
            display: block;
            width: 100%;
        }

        .nav-item:hover { color: var(--brown); }

        .nav-item.active {
            color: var(--brown);
            font-weight: 500;
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 14px;
            background: var(--champagne);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
        }

        .areas-sublist {
            margin-left: 1.2rem;
            margin-bottom: 0.8rem;
            border-left: 1px solid var(--champagne-line);
            padding-left: 0.6rem;
        }

        .areas-sublabel {
            font-size: 0.5rem;
            letter-spacing: 0.3em;
            color: var(--brown-mute);
            padding: 0.3rem 0 0.3rem 0.4rem;
            opacity: 0.7;
        }

        .area-item {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: var(--brown-mute);
            padding: 0.45rem 0 0.45rem 0.6rem;
            cursor: grab;
            transition: all 0.25s;
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            user-select: none;
        }

        .area-item:active { cursor: grabbing; }
        .area-item:hover { color: var(--brown); }

        .area-item.active {
            color: var(--brown);
            font-weight: 500;
        }

        .area-item.active::before {
            content: '';
            position: absolute;
            left: -0.6rem;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 12px;
            background: var(--champagne);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
        }

        .area-item.dragging { opacity: 0.4; }
        .area-item.drag-over { border-top: 2px solid var(--champagne); }

        .area-item .area-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .area-item .area-edit-icon {
            font-size: 0.6rem;
            opacity: 0;
            padding: 0.1rem 0.25rem;
            border-radius: 1rem;
            transition: 0.1s;
            color: var(--brown-mute);
            flex-shrink: 0;
            cursor: pointer;
        }

        .area-item:hover .area-edit-icon { opacity: 1; }
        .area-item .area-edit-icon:hover { background: rgba(212, 175, 55, 0.2); color: var(--brown); }

        .area-item.all-areas {
            font-size: 0.6rem;
            opacity: 0.7;
            margin-bottom: 0.2rem;
        }

        .area-add-inline {
            font-size: 0.6rem;
            color: var(--brown-mute);
            padding: 0.4rem 0.6rem;
            cursor: pointer;
            border: 1px dashed rgba(212, 175, 55, 0.3);
            border-radius: 0.4rem;
            margin-top: 0.3rem;
            text-align: center;
            transition: 0.15s;
        }
        .area-add-inline:hover {
            background: rgba(212, 175, 55, 0.1);
            color: var(--brown);
        }

        .main {
            padding: 2.5rem 2.5rem 2rem 1.5rem;
            overflow-y: auto;
            max-height: 100vh;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .topbar-date {
            font-family: 'Noto Serif TC', 'Georgia', serif;
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: var(--brown);
            margin-bottom: 0.3rem;
        }

        .topbar-welcome {
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            color: var(--brown-mute);
        }

        .topbar-right { display: flex; align-items: center; gap: 0.8rem; }

        .topbar-weather {
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            color: var(--brown-soft);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.9rem;
            background: rgba(255, 252, 245, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 2rem;
            border: 1px solid var(--champagne-line);
        }

        .topbar-icon {
            width: 34px; height: 34px;
            border-radius: 50%;
            background: rgba(255, 252, 245, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--champagne-line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: var(--brown-soft);
            cursor: pointer;
            transition: all 0.2s;
        }
        .topbar-icon:hover { background: rgba(255, 252, 245, 0.85); border-color: var(--champagne); color: var(--brown); }

        .page { display: none; }
        .page.active { display: block; }

        .area-header {
            margin-bottom: 2.2rem;
            position: relative;
        }

        .area-header .kicker {
            font-size: 0.6rem;
            letter-spacing: 0.4em;
            color: var(--champagne);
            margin-bottom: 0.6rem;
        }

        .area-header h1 {
            font-family: 'Noto Serif TC', 'Georgia', serif;
            font-size: 2.6rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            line-height: 1.1;
            color: var(--brown);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .area-header .deco-moon {
            position: absolute;
            top: 0; right: 0;
            font-size: 2rem;
            color: var(--champagne);
            opacity: 0.35;
        }

        .area-stats { display: flex; gap: 2rem; flex-wrap: wrap; margin-top: 0.5rem; }
        .area-stat { display: flex; flex-direction: column; gap: 0.2rem; }
        .area-stat .stat-value {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.6rem;
            font-weight: 400;
            color: var(--brown);
            line-height: 1;
        }
        .area-stat .stat-label {
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            color: var(--brown-mute);
        }

        .section { margin-bottom: 2.5rem; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid var(--champagne-line);
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .section-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: var(--brown-soft);
        }

        .section-action {
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            color: var(--champagne);
            cursor: pointer;
            background: transparent;
            border: none;
            font-family: inherit;
            padding: 0.2rem 0.5rem;
            border-radius: 1rem;
            transition: 0.15s;
        }
        .section-action:hover { background: rgba(212, 175, 55, 0.15); color: #8a6d3a; }

        .attention-item {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.12);
            flex-wrap: wrap;
            transition: 0.15s;
        }
        .attention-item:last-child { border-bottom: none; }
        .attention-item:hover {
            background: rgba(255, 252, 245, 0.3);
            margin: 0 -0.6rem;
            padding-left: 1.6rem;
            padding-right: 1.6rem;
            border-radius: 0.6rem;
        }

        .at-icon { font-size: 1.1rem; line-height: 1.3; flex-shrink: 0; width: 22px; text-align: center; }
        .at-icon.warning { color: var(--red); }
        .at-icon.progress { color: var(--champagne); }

        .at-body { flex: 1; min-width: 200px; }

        .at-title {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--brown);
            margin-bottom: 0.3rem;
            cursor: pointer;
        }
        .at-title:hover { color: #8a6d3a; }

        .at-meta {
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            color: var(--brown-mute);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .at-meta .sep { opacity: 0.4; }

        .at-due {
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            color: var(--brown-soft);
            text-align: right;
            flex-shrink: 0;
            min-width: 90px;
        }
        .at-due.overdue, .at-due.today { color: var(--red); font-weight: 500; }

        .track-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .track-card {
            background: rgba(255, 252, 245, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 1.2rem;
            padding: 1.3rem 1.5rem;
            border: 1px solid var(--champagne-line);
            transition: all 0.25s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .track-card:hover {
            box-shadow: 0 8px 28px rgba(140, 120, 90, 0.12);
            border-color: rgba(212, 175, 55, 0.6);
            transform: translateY(-2px);
        }

        .track-card .tc-name {
            font-family: 'Noto Serif TC', serif;
            font-size: 1rem;
            color: var(--brown);
            margin-bottom: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .track-card .tc-name .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .tc-progress-label { font-size: 0.6rem; letter-spacing: 0.15em; color: var(--brown-mute); margin-bottom: 0.3rem; }
        .tc-bar-bg {
            height: 5px;
            background: rgba(212, 175, 55, 0.15);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 0.4rem;
        }
        .tc-bar-fill {
            height: 100%;
            border-radius: 20px;
            transition: width 0.4s;
        }
        .tc-progress-num { font-size: 0.85rem; font-weight: 600; color: #b89b6e; margin-bottom: 0.6rem; }
        .tc-next { font-size: 0.7rem; color: var(--brown-soft); margin-bottom: 0.5rem; letter-spacing: 0.05em; }
        .tc-next .label { color: var(--brown-mute); font-size: 0.6rem; letter-spacing: 0.1em; margin-right: 0.3rem; }
        .tc-stats {
            font-size: 0.62rem;
            letter-spacing: 0.08em;
            color: var(--brown-mute);
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(212, 175, 55, 0.15);
        }

        .roadmap-container {
            background: rgba(255, 252, 245, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 1.4rem;
            padding: 2rem 1.8rem 1.6rem;
            border: 1px solid var(--champagne-line);
            box-shadow: 0 8px 32px rgba(140, 120, 90, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.7);
            margin-bottom: 2.5rem;
            position: relative;
            overflow: hidden;
        }
        .roadmap-container::before {
            content: '';
            position: absolute;
            top: 0; left: 2rem; right: 2rem;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.5), transparent);
        }
        .roadmap-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .roadmap-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: var(--brown-soft);
        }
        .roadmap-legend {
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            color: var(--brown-mute);
            display: flex;
            gap: 1rem;
        }
        .roadmap-legend span { display: flex; align-items: center; gap: 0.3rem; }
        .roadmap-legend .lg-dot {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 50%;
            border: 2px solid rgba(212, 175, 55, 0.5);
            background: rgba(255, 252, 245, 0.8);
        }
        .roadmap-legend .lg-dot.achieved { background: linear-gradient(135deg, #d4c4aa, var(--champagne)); border-color: var(--champagne); }
        .roadmap-legend .lg-dot.in-progress { border-color: var(--champagne); background: linear-gradient(135deg, #e0d0b8, var(--champagne)); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); }

        .roadmap-track { margin-bottom: 2rem; position: relative; }
        .roadmap-track:last-child { margin-bottom: 0; }
        .roadmap-track-name {
            font-family: 'Noto Serif TC', serif;
            font-size: 0.85rem;
            color: var(--brown);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .roadmap-track-name .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .roadmap-track-name .area-tag {
            font-size: 0.55rem;
            letter-spacing: 0.15em;
            color: var(--champagne);
            margin-left: 0.3rem;
        }
        .roadmap-line {
            display: flex;
            align-items: flex-start;
            min-width: fit-content;
            padding: 0.5rem 0;
        }
        .roadmap-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            flex-shrink: 0;
            min-width: 120px;
            cursor: pointer;
        }
        .roadmap-node.dragging { opacity: 0.4; }
        .roadmap-node.drag-over { border-left: 2px solid var(--champagne); }
        .roadmap-circle {
            width: 24px; height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(212, 175, 55, 0.35);
            background: rgba(255, 252, 245, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.55rem;
            color: transparent;
            transition: all 0.3s;
            position: relative;
            z-index: 2;
            box-shadow: 0 2px 8px rgba(180, 155, 110, 0.1);
        }
        .roadmap-node.achieved .roadmap-circle {
            background: linear-gradient(135deg, #d4c4aa, var(--champagne));
            border-color: var(--champagne);
            color: #fffcf5;
            box-shadow: 0 2px 12px rgba(212, 175, 55, 0.3);
        }
        .roadmap-node.in-progress .roadmap-circle {
            border-color: var(--champagne);
            box-shadow: 0 0 0 5px rgba(212, 175, 55, 0.2), 0 2px 12px rgba(212, 175, 55, 0.25);
            background: linear-gradient(135deg, #e0d0b8, var(--champagne));
            color: #fffcf5;
        }
        .roadmap-node:hover .roadmap-circle { transform: scale(1.15); }

        .roadmap-label {
            margin-top: 0.5rem;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            color: var(--brown-soft);
            text-align: center;
            max-width: 120px;
            line-height: 1.3;
            word-break: break-word;
        }
        .roadmap-node.achieved .roadmap-label { color: #8a7a62; }
        .roadmap-node.in-progress .roadmap-label { color: var(--brown); font-weight: 600; }
        .roadmap-meta {
            font-size: 0.58rem;
            color: var(--brown-mute);
            margin-top: 0.15rem;
            letter-spacing: 0.05em;
            text-align: center;
        }
        .roadmap-connector {
            flex: 1;
            min-width: 50px;
            height: 2px;
            background: rgba(212, 175, 55, 0.15);
            margin-top: 13px;
            position: relative;
            z-index: 1;
        }
        .roadmap-connector.done { background: linear-gradient(90deg, #d4c4aa, var(--champagne)); box-shadow: 0 0 4px rgba(212, 175, 55, 0.3); }
        .roadmap-connector.current { background: linear-gradient(90deg, var(--champagne) 0%, var(--champagne) 40%, rgba(212, 175, 55, 0.15) 40%, rgba(212, 175, 55, 0.15) 100%); }
        .roadmap-empty-track {
            padding: 0.8rem 0;
            font-size: 0.75rem;
            color: var(--brown-mute);
            letter-spacing: 0.05em;
            font-style: italic;
            opacity: 0.8;
        }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            padding: 0.6rem 1rem;
            background: rgba(255, 252, 245, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 1rem;
            border: 1px solid var(--champagne-line);
            font-size: 0.75rem;
        }
        .filter-label {
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            color: var(--brown-mute);
        }
        .filter-bar select {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--champagne-line);
            border-radius: 0.5rem;
            padding: 0.3rem 0.6rem;
            font-family: inherit;
            font-size: 0.72rem;
            color: var(--brown);
            outline: none;
            cursor: pointer;
        }
        .filter-tab {
            padding: 0.3rem 0.8rem;
            border-radius: 1rem;
            cursor: pointer;
            color: var(--brown-mute);
            border: 1px solid transparent;
            transition: 0.15s;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            background: transparent;
            font-family: inherit;
        }
        .filter-tab:hover { color: var(--brown); }
        .filter-tab.active {
            background: rgba(212, 175, 55, 0.2);
            border-color: rgba(212, 175, 55, 0.5);
            color: var(--brown);
        }

        .task-list-flat { display: flex; flex-direction: column; gap: 0.6rem; }

        .flat-task {
            background: rgba(255, 252, 245, 0.45);
            border-radius: 0.9rem;
            padding: 1rem 1.2rem;
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: 0.2s;
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .flat-task:hover {
            background: rgba(255, 252, 245, 0.75);
            border-color: rgba(212, 175, 55, 0.4);
        }
        .flat-task .breadcrumb {
            font-size: 0.6rem;
            letter-spacing: 0.08em;
            color: var(--brown-mute);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-wrap: wrap;
            margin-bottom: 0.3rem;
        }
        .flat-task .breadcrumb .sep { opacity: 0.5; }
        .flat-task .task-name {
            flex: 1 1 200px;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--brown);
        }
        .flat-task.completed .task-name { text-decoration: line-through; color: var(--brown-mute); }
        .flat-task .task-right {
            display: flex;

            .drawer { width: 100vw; max-width: 100vw; }

    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="logo">
                    <span class="moon-icon">☽</span>
                    <span>月庭</span>
                </div>

            <div class="nav-group">

            </div>

            <div class="nav-group">
                <div class="nav-group-label">工作</div>
                <button class="nav-item" data-page="mytasks">我的任務</button>
                <button class="nav-item" data-page="projects">專案</button>

            <div class="nav-group">

                <div class="topbar-right">

                    <div class="topbar-icon" title="設定">⚙</div>
                </div>

            <div class="page active" id="page-overview"><div id="overviewContent"></div></div>
            <div class="page" id="page-mytasks">
                <div class="filter-bar">
                    <span class="filter-label">領域</span>
                    <select id="mytasksAreaFilter"><option value="all">全部領域</option></select>
                    <span style="width:1px;height:16px;background:var(--champagne-line);"></span>
                    <button class="filter-tab active" data-filter="all">全部</button>
                    <button class="filter-tab" data-filter="active">進行中</button>
                    <button class="filter-tab" data-filter="completed">已完成</button>
                    <button class="filter-tab" data-filter="overdue">逾期</button>

            <div class="page" id="page-timeline">
                <div class="toolbar">
                    <span class="filter-label">檢視</span>

                    <button class="view-tab" data-tl-view="month">月</button>
                    <span class="filter-label" id="tlCountLabel" style="margin-left:1rem;">週數</span>
                    <select id="tlCountSelect">
                        <option value="1">1 週</option>
                        <option value="2">2 週</option>
                        <option value="3">3 週</option>
                        <option value="4">4 週</option>
                        <option value="5">5 週</option>
                        <option value="6">6 週</option>
                    </select>
                    <span class="filter-label" style="margin-left:1rem;">領域</span>
                    <select id="timelineAreaFilter"><option value="all">全部領域</option></select>
                    <div class="toolbar-nav">
                        <button class="nav-arrow" id="tlPrev">‹</button>
                        <span class="toolbar-date" id="tlDateRange"></span>
                        <button class="nav-arrow" id="tlNext">›</button>
                        <button class="btn-today" id="tlToday">今天</button>
                    </div>

                <div id="timelineContent"></div>

            <div class="page" id="page-calendar">
                <div class="toolbar">
                    <span class="filter-label">檢視</span>
                    <button class="view-tab active" data-cal-view="day">日</button>
                    <button class="view-tab" data-cal-view="week">週</button>
                    <button class="view-tab" data-cal-view="month">月</button>
                    <span class="filter-label" style="margin-left:1rem;">領域</span>
                    <select id="calendarAreaFilter"><option value="all">全部領域</option></select>
                    <div class="toolbar-nav">

                <div class="filter-bar">
                    <span class="filter-label">領域</span>

    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <div class="drawer-title" id="drawerTitle">任務詳情</div>
            <button class="drawer-close" id="drawerClose">✕</button>
        </div>
        <div class="drawer-body" id="drawerBody"></div>

    <script>
        (function() {
            let areas = [];
            let activeAreaId = null;
            let currentPage = 'overview';
            let filterContext = { areaId: 'all', status: 'all' };
            let insightsAreaId = 'all';

            let tlView = 'week';
            let tlWeekCount = 1;
            let tlMonthCount = 1;
            let tlAnchor = new Date();
            let tlAreaId = 'all';

            let calView = 'day';
            let calAnchor = new Date();
            let calAreaId = 'all';

            let currentTrackId = null;
            let addTaskPanelOpen = false;

            const TRACK_COLORS = [
                '#D4AF37', '#7BA8A0', '#B08D57', '#8E9AAF', '#C9886E',
                '#A8B89A', '#C9A6B8', '#8B9DC3', '#D4A5A5', '#9CB4A8'
            ];

            // 固定 key，不再改版本號
            const STORAGE_KEY = 'luneAppData';

            function generateId() {
                return Date.now() + Math.random().toString(36).substring(2, 9);
            }

            function getSampleAreas() { return []; }

            function migrateData() {
                areas.forEach(area => {
                    const migrateTask = (t) => {
                        if (t.milestoneId !== undefined && t.milestoneIds === undefined) {
                            t.milestoneIds = t.milestoneId ? [t.milestoneId] : [];
                            delete t.milestoneId;
                        } else if (t.milestoneIds === undefined) t.milestoneIds = [];
                        if (!t.schedule) t.schedule = [];
                        if (!t.tags) t.tags = [];
                        if (!t.subtasks) t.subtasks = [];
                    };
                    area.tracks.forEach((track, i) => {
                        if (!track.color) track.color = TRACK_COLORS[i % TRACK_COLORS.length];
                        (track.tasks || []).forEach(migrateTask);
                        (track.milestones || []).forEach(ms => {
                            (ms.tasks || []).forEach(migrateTask);
                            if (!ms.tasks) ms.tasks = [];
                        });
                    });
                    (area.unassignedTasks || []).forEach(migrateTask);
                });
            }

            function cleanupMilestoneTasks() {
                areas.forEach(area => {
                    area.tracks.forEach(track => {
                        (track.milestones || []).forEach(ms => {
                            ms.tasks = [];
                        });
                    });
                });
            }

            function init() {
                // 先嘗試讀舊 key（V12），如果沒有再讀新的固定 key
                let saved = localStorage.getItem(STORAGE_KEY);
                if (!saved) {
                    // 嘗試讀舊版 key 並遷移
                    const oldKeys = ['luneAppV12', 'luneAppV11', 'luneAppV10', 'luneAppV9', 'luneAppV8', 'luneAppV7'];
                    for (const k of oldKeys) {
                        const old = localStorage.getItem(k);
                        if (old) {
                            saved = old;
                            localStorage.setItem(STORAGE_KEY, old);
                            break;
                        }
                    }
                }
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        areas = parsed.areas || getSampleAreas();
                        activeAreaId = parsed.activeAreaId !== undefined ? parsed.activeAreaId : (areas[0] ? areas[0].id : null);
                    } catch (e) {
                        areas = getSampleAreas();
                        activeAreaId = null;
                    }
                } else {
                    areas = getSampleAreas();
                    activeAreaId = null;
                }
                migrateData();
                cleanupMilestoneTasks();
                if (activeAreaId !== null && !areas.find(a => a.id === activeAreaId)) {
                    activeAreaId = areas[0] ? areas[0].id : null;
                }
                renderTopbarDate();
                renderAll();
            }

            function save() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ areas, activeAreaId }));
            }

            function renderTopbarDate() {
                const now = new Date();
                const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
                document.getElementById('topbarDate').textContent = now.toLocaleDateString('zh-TW', options);
                const hour = now.getHours();
                let greeting = '早安';
                if (hour >= 12 && hour < 18) greeting = '午安';
                else if (hour >= 18) greeting = '晚安';
                document.getElementById('topbarWelcome').textContent = greeting;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text == null ? '' : text;
                return div.innerHTML;
            }

            function dateKey(d) {
                const dt = new Date(d);
                return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
            }
            function parseDate(str) {
                if (!str) return null;
                const d = new Date(str);
                if (isNaN(d.getTime())) return null;
                return d;
            }
            function addDays(date, n) {
                const d = new Date(date);
                d.setDate(d.getDate() + n);
                return d;
            }
            function startOfWeek(date) {
                const d = new Date(date);
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                d.setDate(diff);
                d.setHours(0, 0, 0, 0);
                return d;
            }

            function startInlineEdit(element, currentValue, onSave) {
                if (element.querySelector('.inline-edit-input')) return;
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'inline-edit-input';
                input.value = currentValue;
                const original = element.textContent;
                element.textContent = '';
                element.appendChild(input);
                input.focus();
                input.select();
                let finished = false;
                function finish(saveIt) {
                    if (finished) return;
                    finished = true;
                    const newValue = input.value.trim();
                    if (saveIt && newValue && newValue !== currentValue) onSave(newValue);
                    else element.textContent = original;
                }
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
                    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
                });
                input.addEventListener('blur', function() { finish(true); });
            }

            function getTaskProgress(task) {
                if (!task.subtasks || task.subtasks.length === 0) return task.completed ? 100 : 0;
                const done = task.subtasks.filter(st => st.completed).length;
                return Math.round((done / task.subtasks.length) * 100);
            }

            function getMilestoneProgress(ms) {
                if (ms.type === 'numeric') {
                    if (ms.status === 'achieved') return 100;
                    if (ms.start !== undefined && ms.current !== undefined && ms.target !== undefined) {
                        const total = Math.abs(ms.start - ms.target);
                        if (total === 0) return 100;
                        const done = Math.abs(ms.start - ms.current);
                        const auto = Math.round((done / total) * 100);
                        if (ms.manualProgress !== undefined && ms.manualProgress !== null) {
                            return Math.max(0, Math.min(100, ms.manualProgress));
                        }
                        return Math.max(0, Math.min(100, auto));
                    }
                    return Math.min(100, Math.round(ms.progress || 0));
                }
                if (ms.type === 'binary') return ms.status === 'achieved' ? 100 : 0;
                return ms.progress || 0;
            }

            function getTrackProgress(track) {
                if (track.milestones && track.milestones.length > 0) {
                    const sum = track.milestones.reduce((acc, m) => acc + getMilestoneProgress(m), 0);
                    return Math.round(sum / track.milestones.length);
                }
                if (track.tasks && track.tasks.length > 0) {
                    const sum = track.tasks.reduce((acc, t) => acc + getTaskProgress(t), 0);
                    return Math.round(sum / track.tasks.length);
                }
                return 0;
            }

            function getAllTasksOfTrack(track) {
                const all = [];
                (track.tasks || []).forEach(t => all.push({ task: t, milestone: null }));
                all.forEach(item => {
                    const t = item.task;
                    if (t.milestoneIds && t.milestoneIds.length > 0) {
                        for (const msId of t.milestoneIds) {
                            const ms = (track.milestones || []).find(m => m.id === msId);
                            if (ms) {
                                item.milestone = ms;
                                break;
                            }
                        }
                    }
                });
                return all;
            }

            function findTrackById(trackId) {
                for (const area of areas) for (const track of area.tracks) if (track.id === trackId) return { track, area };
                return null;

            function findTaskById(taskId) {
                for (const area of areas) {
                    for (const track of area.tracks) {
                        for (const task of (track.tasks || [])) if (task.id === taskId) return { task, track, milestone: null, area };
                    }
                    for (const task of (area.unassignedTasks || [])) if (task.id === taskId) return { task, track: null, milestone: null, area };
                }

            function findMilestoneById(msId) {
                for (const area of areas) for (const track of area.tracks) for (const ms of (track.milestones || [])) if (ms.id === msId) return { milestone: ms, track, area };

            function getAttentionItems() {
                const items = [];
                const today = new Date(new Date().toDateString());
                areas.forEach(area => {
                    if (activeAreaId !== null && area.id !== activeAreaId) return;
                    const allTasks = [];
                    (area.unassignedTasks || []).forEach(t => allTasks.push({ task: t, track: null, area }));
                    area.tracks.forEach(track => {
                        (track.tasks || []).forEach(t => allTasks.push({ task: t, track, area }));
                    });
                    allTasks.forEach(({ task, track, milestone, area }) => {
                        if (task.completed || task.status === 'cancelled') return;
                        let priority = 999, reason = '';
                        if (task.dueDate) {
                            const dueDate = new Date(task.dueDate);
                            if (dueDate < today) { priority = 0; reason = '逾期'; }
                            else if (dueDate.getTime() === today.getTime()) { priority = 1; reason = '今天到期'; }
                            else {
                                const diff = Math.round((dueDate - today) / 86400000);
                                if (diff <= 3) { priority = 2; reason = `${diff} 天後到期`; }
                            }
                        }
                        if (task.status === 'blocked' && priority > 3) { priority = 3; reason = '阻塞'; }
                        if (task.status === 'in-progress' && priority > 4) { priority = 4; reason = '進行中'; }
                        if (priority < 999) items.push({ type: 'task', priority, reason, task, track, milestone, area });
                    });
                    (area.tracks || []).forEach(track => {
                        (track.milestones || []).forEach(ms => {
                            if (ms.status === 'achieved' || ms.status === 'cancelled') return;
                            let priority = 999, reason = '';
                            if (ms.due) {
                                const dueDate = new Date(ms.due);
                                if (dueDate < today) { priority = 0; reason = '逾期'; }
                                else {
                                    const diff = Math.round((dueDate - today) / 86400000);
                                    if (diff <= 14) { priority = 5; reason = `${diff} 天後`; }
                                }
                            }
                            if (ms.status === 'in-progress' && priority > 6) { priority = 6; reason = '進行中'; }
                            if (priority < 999) items.push({ type: 'milestone', priority, reason, milestone: ms, track, area });
                        });
                    });
                });
                items.sort((a, b) => a.priority - b.priority);
                return items.slice(0, 5);
            }

            function renderMyTasks() {

                    area.tracks.forEach(track => {
                        (track.tasks || []).forEach(t => allTasks.push({ task: t, track, area }));
                    });
                });

                if (filterStatus === 'active') allTasks = allTasks.filter(x => !x.task.completed && x.task.status !== 'cancelled');
                else if (filterStatus === 'completed') allTasks = allTasks.filter(x => x.task.completed);
                else if (filterStatus === 'overdue') allTasks = allTasks.filter(x => !x.task.completed && x.task.dueDate && new Date(x.task.dueDate) < today);
                else if (filterStatus === 'today') allTasks = allTasks.filter(x => !x.task.completed && x.task.dueDate && new Date(x.task.dueDate).getTime() === today.getTime());
                else if (filterStatus === 'unscheduled') allTasks = allTasks.filter(x => !x.task.startDate && !x.task.dueDate && (!x.task.schedule || x.task.schedule.length === 0));

                allTasks.sort((a, b) => {
                    const aOverdue = a.task.dueDate && new Date(a.task.dueDate) < today && !a.task.completed;
                    const bOverdue = b.task.dueDate && new Date(b.task.dueDate) < today && !b.task.completed;
                    if (aOverdue && !bOverdue) return -1;
                    if (!aOverdue && bOverdue) return 1;
                    const pa = { high: 0, medium: 1, low: 2 }[a.task.priority] ?? 3;
                    const pb = { high: 0, medium: 1, low: 2 }[b.task.priority] ?? 3;
                    if (pa !== pb) return pa - pb;
                    if (a.task.dueDate && b.task.dueDate) return new Date(a.task.dueDate) - new Date(b.task.dueDate);
                    return 0;
                });

                let html = `<div class="task-list-flat">`;

                        html += `

                                onclick="if(!this.classList.contains('dragging'))window.openMilestoneDrawer('${ms.id}')">

            function getTrackMinutesOnDay(track, dayKey) {
                let minutes = 0;
                (track.tasks || []).forEach(t => {
                    if (t.completed) return;
                    if (t.schedule && t.schedule.length > 0) {
                        t.schedule.forEach(sch => {
                            const start = new Date(sch.start);
                            const end = new Date(sch.end);
                            if (dateKey(start) === dayKey) {
                                minutes += (end - start) / 60000;
                            }
                        });
                        return;
                    }
                    const start = parseDate(t.startDate) || parseDate(t.dueDate);
                    const end = parseDate(t.dueDate) || parseDate(t.startDate);
                    if (!start || !end) return;
                    if (dayKey < dateKey(start) || dayKey > dateKey(end)) return;
                    const totalDays = Math.round((end - start) / 86400000) + 1;
                    if (totalDays <= 0) return;
                    minutes += (t.estimatedTime || 0) / totalDays;
                });
                return minutes;
            }

            function renderTimeline() {
                const el = document.getElementById('timelineContent');
                let allDays = [];
                let rangeLabel = '';

                if (tlView === 'week') {
                    const start = startOfWeek(tlAnchor);
                    const totalDays = 7 * tlWeekCount;
                    for (let i = 0; i < totalDays; i++) allDays.push(addDays(start, i));
                    const end = allDays[allDays.length - 1];
                    rangeLabel = `${start.getMonth() + 1}/${start.getDate()} – ${end.getMonth() + 1}/${end.getDate()}`;
                } else {
                    const start = new Date(tlAnchor.getFullYear(), tlAnchor.getMonth(), 1);
                    const end = new Date(tlAnchor.getFullYear(), tlAnchor.getMonth() + tlMonthCount, 0);
                    for (let d = new Date(start); d <= end; d = addDays(d, 1)) allDays.push(new Date(d));
                    rangeLabel = `${start.getFullYear()}年${start.getMonth() + 1}月 – ${end.getFullYear()}年${end.getMonth() + 1}月`;
                }
                document.getElementById('tlDateRange').textContent = rangeLabel;

                const todayKey = dateKey(new Date());
                const tracks = [];
                areas.forEach(area => {
                    if (tlAreaId !== 'all' && area.id !== tlAreaId) return;
                    area.tracks.forEach(track => tracks.push({ track, area }));
                });

                let groups = [];
                if (tlView === 'week') {
                    for (let w = 0; w < tlWeekCount; w++) {
                        const weekDays = allDays.slice(w * 7, (w + 1) * 7);
                        groups.push({ days: weekDays, label: null });
                    }
                } else {
                    let currentMonth = null;
                    let currentGroup = null;
                    allDays.forEach(d => {
                        const monthKey = d.getFullYear() + '-' + d.getMonth();
                        if (monthKey !== currentMonth) {
                            currentMonth = monthKey;
                            currentGroup = { days: [], label: `${d.getFullYear()}年${d.getMonth() + 1}月` };
                            groups.push(currentGroup);
                        }
                        currentGroup.days.push(d);
                    });
                }

                let html = `<div class="timeline-wrapper"><div class="timeline-scroll">`;
                if (tracks.length === 0) {
                    html += `<div class="empty-state" style="text-align:center;padding:2rem;color:var(--brown-mute);font-style:italic;">沒有軌道可以顯示。</div>`;
                } else {
                    groups.forEach((group, groupIdx) => {
                        const days = group.days;
                        const groupStartKey = dateKey(days[0]);
                        const groupEndKey = dateKey(days[days.length - 1]);
                        const minCol = tlView === 'month' ? '10px' : '50px';
                        if (group.label) {
                            html += `<div class="timeline-month-label">${group.label}</div>`;
                        }
                        html += `<div class="timeline-grid" style="margin-bottom:${groupIdx < groups.length - 1 ? '2rem' : '0'};${tlView === 'month' ? 'grid-template-columns:80px 1fr;' : ''}">`;
                        html += `<div class="timeline-header-row" style="${tlView === 'month' ? 'grid-template-columns:80px 1fr;' : ''}"><div></div><div class="timeline-header-days" style="grid-template-columns: repeat(${days.length}, minmax(${minCol}, 1fr));">`;
                        days.forEach(d => {
                            const isToday = dateKey(d) === todayKey;
                            const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
                            if (tlView === 'month' && days.length > 20 && d.getDate() % 2 !== 0 && d.getDate() !== 1) {
                                html += `<div class="timeline-day-header ${isToday ? 'today' : ''}"><span class="day-name" style="opacity:0.3;">${dayNames[d.getDay()]}</span></div>`;
                            } else {
                                html += `<div class="timeline-day-header ${isToday ? 'today' : ''}"><span class="day-name">${dayNames[d.getDay()]}</span><span class="day-num">${d.getDate()}</span></div>`;
                            }
                        });
                        html += `</div></div>`;

                        tracks.forEach(({ track, area }) => {
                            const color = track.color || TRACK_COLORS[0];
                            const tasks = track.tasks || [];

                            html += `<div class="timeline-track-row">`;
                            html += `<div class="timeline-track-name"><span class="dot" style="background:${color};"></span>${escapeHtml(track.name)}${tlAreaId === 'all' ? `<span class="area-tag">${escapeHtml(area.name)}</span>` : ''}</div>`;
                            html += `<div class="timeline-track-bars" style="grid-template-columns: repeat(${days.length}, minmax(${minCol}, 1fr));">`;
                            html += `<div class="timeline-day-grid" style="grid-template-columns: repeat(${days.length}, 1fr); grid-column: 1 / -1;">`;
                            days.forEach(d => html += `<div class="${dateKey(d) === todayKey ? 'today' : ''}"></div>`);
                            html += `</div>`;
                            const todayIndex = days.findIndex(d => dateKey(d) === todayKey);
                            if (todayIndex >= 0) html += `<div class="timeline-today-line" style="left: ${((todayIndex + 0.5) / days.length) * 100}%;"></div>`;

                            tasks.forEach(task => {
                                const taskStart = parseDate(task.startDate) || parseDate(task.dueDate);
                                const taskEnd = parseDate(task.dueDate) || parseDate(task.startDate);
                                if (!taskStart || !taskEnd) return;
                                const taskStartKey = dateKey(taskStart);
                                const taskEndKey = dateKey(taskEnd);

                                // 判斷這個任務是否跟這一組有重疊
                                if (taskEndKey < groupStartKey || taskStartKey > groupEndKey) return;

                                // 把任務的起點和終點裁剪到這一組的範圍內
                                const visibleStartKey = taskStartKey < groupStartKey ? groupStartKey : taskStartKey;
                                const visibleEndKey = taskEndKey > groupEndKey ? groupEndKey : taskEndKey;

                                // 找到對應的 index
                                let startIdx = days.findIndex(d => dateKey(d) === visibleStartKey);
                                let endIdx = days.findIndex(d => dateKey(d) === visibleEndKey);

                                // 如果找不到（可能跨月或跨週的邊界），用 >= 找第一個符合的
                                if (startIdx === -1) {
                                    startIdx = days.findIndex(d => dateKey(d) >= visibleStartKey);
                                }
                                if (endIdx === -1) {
                                    endIdx = days.findIndex(d => dateKey(d) >= visibleEndKey);
                                }
                                // 如果還是找不到，退回到該組的最後一天
                                if (startIdx === -1) startIdx = 0;
                                if (endIdx === -1) endIdx = days.length - 1;
                                if (endIdx < startIdx) return;

                                const span = endIdx - startIdx + 1;
                                // 判斷是否被裁切
                                const isContinuedLeft = taskStartKey < groupStartKey;
                                const isContinuedRight = taskEndKey > groupEndKey;
                                let extraClass = '';
                                if (isContinuedLeft) extraClass += ' continued-left';
                                if (isContinuedRight) extraClass += ' continued-right';

                                html += `<div class="timeline-task-bar ${task.completed ? 'completed' : ''}${extraClass}" style="grid-column: ${startIdx + 1} / span ${span};background:${color};" onclick="window.openTaskDrawer('${task.id}')">${escapeHtml(task.title)}</div>`;
                            });

                            html += `</div></div>`;
                        });
                        html += `</div>`;
                    });
                }

                const unscheduled = [];
                areas.forEach(area => {
                    if (tlAreaId !== 'all' && area.id !== tlAreaId) return;
                    (area.unassignedTasks || []).forEach(t => { if (!t.completed && !t.startDate && !t.dueDate && (!t.schedule || t.schedule.length === 0)) unscheduled.push({ task: t }); });
                    area.tracks.forEach(track => {
                        (track.tasks || []).forEach(t => { if (!t.completed && !t.startDate && !t.dueDate && (!t.schedule || t.schedule.length === 0)) unscheduled.push({ task: t }); });
                    });
                });
                html += `<div class="unscheduled-area"><div class="unscheduled-title">未排程</div>`;
                if (unscheduled.length === 0) html += `<div style="font-size:0.75rem;color:var(--brown-mute);font-style:italic;">沒有未排程的任務。</div>`;
                else {
                    html += `<div class="unscheduled-list">`;
                    unscheduled.forEach(({ task }) => html += `<div class="unscheduled-item" onclick="window.openTaskDrawer('${task.id}')">○ ${escapeHtml(task.title)}</div>`);
                    html += `</div>`;
                }
                html += `</div>`;

                html += `<div class="capacity-section"><div class="capacity-title">時間容量</div><div class="capacity-note">若有排程優先用排程時長，否則預估總時數平均分攤到任務跨越的每一天</div><div class="capacity-rows">`;
                allDays.forEach(d => {
                    const key = dateKey(d);
                    let totalMinutes = 0;
                    tracks.forEach(({ track }) => {
                        totalMinutes += getTrackMinutesOnDay(track, key);
                    });
                    const pct = Math.min(150, Math.round((totalMinutes / 480) * 100));
                    const over = pct > 100;
                    const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
                    const hoursText = (totalMinutes / 60).toFixed(1) + 'h';
                    html += `<div class="capacity-row"><span>${d.getMonth() + 1}/${d.getDate()} (${dayNames[d.getDay()]})</span><div class="capacity-bar-bg"><div class="capacity-bar-fill ${over ? 'over' : ''}" style="width: ${Math.min(100, pct)}%;"></div></div><span class="capacity-label ${over ? 'over' : ''}">${hoursText} · ${pct}%</span></div>`;
                });
                html += `</div></div>`;

                html += `</div></div>`;
                el.innerHTML = html;
            }

            function renderCalendar() {
                const el = document.getElementById('calendarContent');
                const todayKey = dateKey(new Date());
                const tracks = [];
                areas.forEach(area => {
                    if (calAreaId !== 'all' && area.id !== calAreaId) return;

                                html += `<div class="cal-time-block ${b.task.completed ? 'completed' : ''}" style="top: ${topPct}%; height: ${heightPx}px;background:${b.color};" onclick="event.stopPropagation();window.openTaskDrawer('${b.task.id}')">${escapeHtml(b.task.title)}</div>`;
                            }
                        });
                        html += `</div>`;
                    }
                    const now = new Date();

                    html += `</div>`;
                    html += `<div class="unscheduled-area"><div class="unscheduled-title">未排程</div>`;

                        html += `</div>`;
                    }
                    html += `</div></div>`;
                } else if (calView === 'week') {

                    document.getElementById('calDateRange').textContent = `${start.getMonth() + 1}/${start.getDate()} – ${days[6].getMonth() + 1}/${days[6].getDate()}`;
                    let allBlocks = [];
                    tracks.forEach(({ track }) => {
                        const color = track.color || TRACK_COLORS[0];
                        (track.tasks || []).forEach(task => {
                            (task.schedule || []).forEach(sch => allBlocks.push({ task, start: new Date(sch.start), end: new Date(sch.end), color }));
                        });
                    });
                    html += `<div class="calendar-wrapper"><div class="cal-week-grid">`;
                    html += `<div></div>`;
                    days.forEach(d => {
                        const isToday = dateKey(d) === todayKey;
                        const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
                        html += `<div class="cal-week-header ${isToday ? 'today' : ''}"><span class="day-name">${dayNames[d.getDay()]}</span><span class="day-num">${d.getDate()}</span></div>`;
                    });
                    for (let h = 8; h < 22; h++) {
                        html += `<div class="cal-hour-label">${String(h).padStart(2, '0')}:00</div>`;
                        days.forEach(d => {
                            html += `<div class="cal-week-cell">`;
                            allBlocks.forEach(b => {
                                if (dateKey(b.start) === dateKey(d) && b.start.getHours() === h) {
                                    const durationMin = (b.end - b.start) / 60000;
                                    const heightPx = Math.max(14, (durationMin / 60) * 40);
                                    html += `<div class="cal-week-block" style="height:${heightPx}px;background:${b.color};" onclick="event.stopPropagation();window.openTaskDrawer('${b.task.id}')">${escapeHtml(b.task.title)}</div>`;
                                }
                            });
                            html += `</div>`;
                        });
                    }
                    html += `</div>`;
                    html += `<div class="unscheduled-area"><div class="unscheduled-title">未排程</div>`;
                    if (unscheduled.length === 0) html += `<div style="font-size:0.75rem;color:var(--brown-mute);font-style:italic;">沒有未排程的任務。</div>`;
                    else {
                        html += `<div class="unscheduled-list">`;
                        unscheduled.forEach(({ task }) => html += `<div class="unscheduled-item" onclick="window.openTaskDrawer('${task.id}')">○ ${escapeHtml(task.title)}</div>`);
                        html += `</div>`;
                    }
                    html += `</div></div>`;
                } else {
                    const year = calAnchor.getFullYear();
                    const month = calAnchor.getMonth();
                    document.getElementById('calDateRange').textContent = `${year}年${month + 1}月`;
                    const firstDay = new Date(year, month, 1);
                    const lastDay = new Date(year, month + 1, 0);
                    const startDay = firstDay.getDay();
                    let taskDates = {};
                    let msDates = {};
                    tracks.forEach(({ track }) => {
                        const color = track.color || TRACK_COLORS[0];
                        (track.tasks || []).forEach(t => {
                            const start = parseDate(t.startDate) || parseDate(t.dueDate);
                            const end = parseDate(t.dueDate) || parseDate(t.startDate);
                            if (!start || !end) return;
                            for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
                                const k = dateKey(d);
                                if (!taskDates[k]) taskDates[k] = [];
                                taskDates[k].push({ task: t, color });
                            }
                        });
                        (track.milestones || []).forEach(ms => {
                            if (!ms.due) return;
                            const k = dateKey(parseDate(ms.due));
                            if (!msDates[k]) msDates[k] = [];
                            msDates[k].push({ milestone: ms, color });
                        });
                    });
                    html += `<div class="calendar-wrapper"><div class="cal-month-grid">`;
                    const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
                    dayNames.forEach(n => html += `<div class="cal-month-header">${n}</div>`);
                    for (let i = 0; i < startDay; i++) html += `<div></div>`;
                    for (let d = 1; d <= lastDay.getDate(); d++) {
                        const dt = new Date(year, month, d);
                        const k = dateKey(dt);
                        const isToday = k === todayKey;
                        const dayTasks = taskDates[k] || [];
                        const dayMs = msDates[k] || [];
                        html += `<div class="cal-month-day ${isToday ? 'today' : ''}"><div class="day-num">${d}</div>`;
                        dayMs.slice(0, 2).forEach(item => {
                            html += `<div class="cal-month-ms">◆ ${escapeHtml(item.milestone.title)}</div>`;
                        });
                        dayTasks.slice(0, 3).forEach(item => {
                            html += `<div class="cal-month-task" style="border-left:3px solid ${item.color};padding-left:3px;">${escapeHtml(item.task.title)}</div>`;
                        });
                        if (dayTasks.length > 3) {
                            html += `<div class="cal-month-task" style="color:var(--brown-mute);">+ ${dayTasks.length - 3} 更多</div>`;
                        }
                        html += `</div>`;
                    }
                    html += `</div></div>`;
                }
                el.innerHTML = html;
            }

            function renderInsights() {
                const el = document.getElementById('insightsContent');
                let totalTasks = 0, completedTasks = 0, overdueTasks = 0;
                let totalMilestones = 0, achievedMilestones = 0;
                let totalEstimated = 0, totalActual = 0;
                let statusDist = { 'not-started': 0, 'in-progress': 0, 'paused': 0, 'blocked': 0, 'completed': 0, 'cancelled': 0 };

                areas.forEach(area => {
                    if (insightsAreaId !== 'all' && area.id !== insightsAreaId) return;
                    const allTasks = [];
                    (area.unassignedTasks || []).forEach(t => allTasks.push(t));
                    area.tracks.forEach(track => {
                        (track.tasks || []).forEach(t => allTasks.push(t));
                        (track.milestones || []).forEach(ms => {
                            totalMilestones++;
                            if (ms.status === 'achieved') achievedMilestones++;
                        });
                    });
                    const today = new Date(new Date().toDateString());
                    allTasks.forEach(t => {
                        totalTasks++;
                        if (t.completed) completedTasks++;
                        if (!t.completed && t.dueDate && new Date(t.dueDate) < today) overdueTasks++;
                        totalEstimated += t.estimatedTime || 0;
                        totalActual += t.actualTime || 0;
                        statusDist[t.status] = (statusDist[t.status] || 0) + 1;
                    });
                });

                const completionRate = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
                const milestoneRate = totalMilestones === 0 ? 0 : Math.round((achievedMilestones / totalMilestones) * 100);

                let html = `
                    <div class="insight-grid">
                        <div class="insight-card"><div class="ic-value">${completionRate}%</div><div class="ic-label">任務完成率</div></div>
                        <div class="insight-card"><div class="ic-value">${completedTasks} / ${totalTasks}</div><div class="ic-label">已完成任務</div></div>
                        <div class="insight-card"><div class="ic-value">${overdueTasks}</div><div class="ic-label">逾期任務</div></div>
                        <div class="insight-card"><div class="ic-value">${milestoneRate}%</div><div class="ic-label">里程碑達成率</div></div>
                        <div class="insight-card"><div class="ic-value">${achievedMilestones} / ${totalMilestones}</div><div class="ic-label">已達成里程碑</div></div>
                        <div class="insight-card"><div class="ic-value">${Math.round(totalEstimated / 60)}h</div><div class="ic-label">預估總時數</div></div>
                        <div class="insight-card"><div class="ic-value">${Math.round(totalActual / 60)}h</div><div class="ic-label">實際總時數</div></div>
                    </div>
                `;

                const statusLabels = { 'not-started': '未開始', 'in-progress': '進行中', 'paused': '暫停', 'blocked': '阻塞', 'completed': '已完成', 'cancelled': '取消' };
                html += `<div class="chart-container"><div class="chart-title">任務狀態分佈</div><div class="bar-chart">`;
                Object.keys(statusDist).forEach(key => {
                    const count = statusDist[key];
                    const pct = totalTasks === 0 ? 0 : (count / totalTasks) * 100;
                    html += `<div class="bar-chart-item"><div class="bar-chart-value">${count}</div><div class="bar-chart-bar" style="height: ${Math.max(2, pct)}%;"></div><div class="bar-chart-label">${statusLabels[key]}</div></div>`;
                });
                html += `</div></div>`;

                html += `<div class="chart-container"><div class="chart-title">各領域任務數</div><div class="bar-chart">`;
                const filteredAreas = areas.filter(a => insightsAreaId === 'all' || a.id === insightsAreaId);
                const maxAreaTasks = Math.max(1, ...filteredAreas.map(a => {
                    let count = (a.unassignedTasks || []).length;
                    a.tracks.forEach(t => { count += (t.tasks || []).length; });
                    return count;
                }));
                filteredAreas.forEach(area => {
                    let count = (area.unassignedTasks || []).length;
                    area.tracks.forEach(t => { count += (t.tasks || []).length; });
                    const pct = (count / maxAreaTasks) * 100;
                    html += `<div class="bar-chart-item"><div class="bar-chart-value">${count}</div><div class="bar-chart-bar" style="height: ${Math.max(2, pct)}%;"></div><div class="bar-chart-label">${escapeHtml(area.name)}</div></div>`;
                });
                html += `</div></div>`;

                el.innerHTML = html;
            }

                    <div class="drawer-field"><div class="drawer-label">狀態</div><select class="drawer-select" id="dTaskStatus" onchange="window.autoSaveTaskField('${task.id}', 'status', this.value)">${statusOptions.map(o => `<option value="${o.value}" ${task.status === o.value ? 'selected' : ''}>${o.label}</option>`).join('')}</select></div>
                    <div class="drawer-field"><div class="drawer-label">優先級</div><select class="drawer-select" id="dTaskPriority" onchange="window.autoSaveTaskField('${task.id}', 'priority', this.value)">${priorityOptions.map(o => `<option value="${o.value}" ${task.priority === o.value ? 'selected' : ''}>${o.label}</option>`).join('')}</select></div>
                    <div class="drawer-field"><div class="drawer-label">所屬</div><div style="font-size:0.82rem;color:var(--brown-soft);">${escapeHtml(area.name)}${track ? ` · ${escapeHtml(track.name)}` : ' · 未分類'}</div></div>
                    <div class="drawer-field"><div class="drawer-label">開始日（清空即為未排程）</div><input class="drawer-input" type="date" id="dTaskStart" value="${task.startDate || ''}" onchange="window.autoSaveTaskField('${task.id}', 'startDate', this.value)"></div>
                    <div class="drawer-field"><div class="drawer-label">截止日（清空即為未排程）</div><input class="drawer-input" type="date" id="dTaskDue" value="${task.dueDate || ''}" onchange="window.autoSaveTaskField('${task.id}', 'dueDate', this.value)"></div>
                    <div class="drawer-field"><div class="drawer-label">排程（可選，會顯示在日曆）</div>
                        <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
                            <input class="drawer-input" type="datetime-local" id="dTaskSchStart" style="flex:1;min-width:150px;" value="${schStart}" onchange="window.autoSaveTaskSchedule('${task.id}')">
                            <input class="drawer-input" type="datetime-local" id="dTaskSchEnd" style="flex:1;min-width:150px;" value="${schEnd}" onchange="window.autoSaveTaskSchedule('${task.id}')">
                        </div>
                    </div>
                    <div class="drawer-field"><div class="drawer-label">預估時間（分鐘）</div><input class="drawer-input" type="number" id="dTaskEstimate" value="${task.estimatedTime || 0}" onchange="window.autoSaveTaskField('${task.id}', 'estimatedTime', parseInt(this.value)||0)"></div>
                    <div class="drawer-field"><div class="drawer-label">實際時間（分鐘）</div><input class="drawer-input" type="number" id="dTaskActual" value="${task.actualTime || 0}" onchange="window.autoSaveTaskField('${task.id}', 'actualTime', parseInt(this.value)||0)"></div>
                    <div class="drawer-field"><div class="drawer-label">標籤（以逗號分隔）</div><input class="drawer-input" id="dTaskTags" value="${(task.tags || []).join(', ')}" onchange="window.autoSaveTaskField('${task.id}', 'tags', this.value.split(',').map(s=>s.trim()).filter(s=>s))"></div>
                    ${track ? `<div class="drawer-field"><div class="drawer-label">關聯里程碑</div><div>${msOptions || '<div style="font-size:0.75rem;color:var(--brown-mute);font-style:italic;">這條軌道沒有里程碑</div>'}</div></div>` : ''}
                    <div class="drawer-field"><div class="drawer-label">子任務</div><div id="dSubtasks">${subtasksHtml || '<div style="font-size:0.75rem;color:var(--brown-mute);font-style:italic;">沒有子任務</div>'}</div><button class="empty-add-btn" style="margin-top:0.5rem;" onclick="window.addSubtaskInDrawer('${task.id}')">＋ 新增子任務</button></div>
                    <div class="drawer-actions">
