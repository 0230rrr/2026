<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>预览</title>
  <style>
    body { background: #f0f8f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; font-family: sans-serif; }
    .wechat-qr-placeholder { width: 160px; height: 160px; border: 2px solid #0b9eb6; background: #ffffff; padding: 8px; border-radius: 22px; box-shadow: 0 8px 20px rgba(11,158,182,0.15); display: grid; place-items: center; }
    .wechat-qr-placeholder img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; display: block; }
    .wechat-qr-note { margin-top: 12px; color: #638087; font-size: 10px; text-align: center; }
    .wechat-qr-note b { color: #0b7e8f; }
  </style>
</head>
<body>
  <div>
    <div class="wechat-qr-placeholder">
      <img src="images/qq.png" alt="二维码" />
    </div>
    <p class="wechat-qr-note">扫码加入答疑群<br>如果二维码失效，请加总召微信：<b>_0230rrr</b></p>
  </div>
</body>
</html>
