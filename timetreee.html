<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一日時間軸 · 24 小時</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Noto Sans SC", "Noto Sans TC", "Microsoft YaHei", sans-serif; background: #f7eedc; color: #5b3d1d; min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem; transition: background .2s, color .2s; }
body.dark { background: #1e1a14; color: #e8dcc8; }
.app { max-width: 1000px; width: 100%; display: flex; flex-direction: column; gap: 2rem; }
.panel { background: rgba(255,249,237,0.85); backdrop-filter: blur(10px); border-radius: 12px; padding: 1.8rem 2rem; border: 1px solid rgba(178,133,69,0.3); box-shadow: 0 12px 35px rgba(105,72,31,0.08); transition: background .2s, border-color .2s; }
body.dark .panel { background: rgba(40,34,26,0.85); border-color: rgba(180,140,80,0.3); box-shadow: 0 12px 35px rgba(0,0,0,0.3); }
h1 { font-family: "Noto Serif TC", Georgia, serif; font-size: 1.6rem; font-weight: 600; letter-spacing: 0.1em; margin-bottom: 1.5rem; color: #5b3d1d; }
body.dark h1 { color: #e8dcc8; }
.form-row { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
.form-field { flex: 1 1 160px; display: flex; flex-direction: column; gap: 0.3rem; }
.form-field label { font-size: 0.7rem; letter-spacing: 0.15em; color: #947957; text-transform: uppercase; font-family: Georgia, serif; }
body.dark .form-field label { color: #b09a7a; }
.form-field input { padding: 0.55rem 0.8rem; border: 1px solid rgba(178,133,69,0.4); border-radius: 6px; background: rgba(255,249,237,0.9); font-family: "Noto Serif TC", serif; font-size: 0.85rem; color: #5b3d1d; outline: none; transition: background .2s, border-color .2s, color .2s; }
body.dark .form-field input { background: rgba(50,44,34,0.9); border-color: rgba(180,140,80,0.4); color: #e8dcc8; }
.form-field input:focus { border-color: #b9822e; box-shadow: 0 0 0 3px rgba(185,130,46,0.15); }
.form-field input[type="color"] { padding: 0.2rem; height: 2.4rem; cursor: pointer; }
.btn-row { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 0.5rem; }
button { padding: 0.55rem 1.4rem; border-radius: 2rem; font-family: "Noto Serif TC", serif; font-size: 0.8rem; letter-spacing: 0.06em; cursor: pointer; transition: 0.15s; border: 1px solid rgba(178,133,69,0.4); background: rgba(255,249,237,0.9); color: #6d5437; }
body.dark button { background: rgba(50,44,34,0.9); border-color: rgba(180,140,80,0.4); color: #d8c8a8; }
button.primary { background: rgba(221,184,108,0.35); border-color: rgba(185,130,46,0.6); color: #5b3d1d; font-weight: 600; }
body.dark button.primary { background: rgba(221,184,108,0.2); border-color: rgba(185,130,46,0.6); color: #f0e0c0; }
button.primary:hover { background: rgba(221,184,108,0.55); }
body.dark button.primary:hover { background: rgba(221,184,108,0.35); }
button.danger { border-color: rgba(168,80,60,0.35); color: #a8503c; }
body.dark button.danger { border-color: rgba(200,110,90,0.5); color: #e08060; }
button.danger:hover { background: rgba(168,80,60,0.1); border-color: #a8503c; }
body.dark button.danger:hover { background: rgba(168,80,60,0.2); }
button:hover { background: rgba(221,184,108,0.2); }
body.dark button:hover { background: rgba(221,184,108,0.15); }
.event-list { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 1rem; }
.event-item { display: flex; align-items: center; gap: 1rem; padding: 0.7rem 1rem; background: rgba(255,249,237,0.7); border-radius: 8px; border-left: 4px solid #b9822e; flex-wrap: wrap; transition: background .2s, border-color .2s; }
body.dark .event-item { background: rgba(50,44,34,0.7); }
.event-item.editing { background: rgba(221,184,108,0.15); }
body.dark .event-item.editing { background: rgba(221,184,108,0.1); }
.event-item .ev-color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.15); }
.event-item .ev-title { flex: 1 1 160px; font-size: 0.92rem; font-weight: 600; font-family: "Noto Serif TC", serif; }
.event-item .ev-dates { font-size: 0.72rem; color: #947957; font-family: Georgia, serif; letter-spacing: 0.04em; }
body.dark .event-item .ev-dates { color: #b09a7a; }
.event-item .ev-order { display: flex; flex-direction: column; gap: 2px; }
.event-item .ev-order button { padding: 0.1rem 0.4rem; border-radius: 3px; font-size: 0.6rem; line-height: 1; min-width: 0; }
.event-item .ev-order button:disabled { opacity: 0.3; cursor: default; }
.event-item .ev-edit-input { padding: 0.35rem 0.6rem; border: 1px solid rgba(178,133,69,0.4); border-radius: 5px; background: rgba(255,249,237,0.95); font-family: "Noto Serif TC", serif; font-size: 0.8rem; color: #5b3d1d; outline: none; }
body.dark .event-item .ev-edit-input { background: rgba(50,44,34,0.95); border-color: rgba(180,140,80,0.4); color: #e8dcc8; }
.event-item .ev-edit-input:focus { border-color: #b9822e; box-shadow: 0 0 0 2px rgba(185,130,46,0.15); }
.event-item .ev-edit-input[type="color"] { padding: 0.1rem; width: 42px; height: 1.9rem; cursor: pointer; }
.event-item .ev-edit-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; width: 100%; }
.day-toolbar { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
.day-label { font-family: Georgia, serif; font-size: 0.9rem; color: #5b3d1d; font-weight: 600; min-width: 200px; }
body.dark .day-label { color: #e8dcc8; }
.nav-arrow { padding: 0.25rem 0.7rem; border-radius: 50%; font-size: 1rem; line-height: 1; }
.btn-today { padding: 0.35rem 0.9rem; font-size: 0.72rem; }
.day-grid-wrap { position: relative; overflow-x: auto; }
.day-grid { position: relative; min-width: 640px; display: grid; grid-template-columns: 70px 1fr; }
.hour-labels { position: relative; }
.hour-label { height: 42px; display: flex; align-items: flex-start; justify-content: flex-end; padding-right: 0.6rem; font-family: Georgia, serif; font-size: 0.68rem; color: #947957; border-top: 1px solid rgba(133,91,39,0.12); transform: translateY(-0.5em); }
body.dark .hour-label { color: #b09a7a; border-top-color: rgba(180,140,80,0.12); }
.hour-label:first-child { border-top: none; transform: none; }
.hour-canvas { position: relative; height: 1008px; background: rgba(255,249,237,0.5); border-left: 1px solid rgba(133,91,39,0.15); }
body.dark .hour-canvas { background: rgba(50,44,34,0.35); border-left-color: rgba(180,140,80,0.15); }
.hour-line { position: absolute; left: 0; right: 0; height: 1px; background: rgba(133,91,39,0.1); pointer-events: none; }
body.dark .hour-line { background: rgba(180,140,80,0.1); }
.hour-line.major { background: rgba(133,91,39,0.18); }
body.dark .hour-line.major { background: rgba(180,140,80,0.18); }
.day-bar { position: absolute; left: 4px; right: 4px; border-radius: 8px; padding: 0.25rem 0.6rem; font-size: 0.7rem; font-family: "Noto Serif TC", serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; box-shadow: 0 2px 6px rgba(105,72,31,0.15); border: 1px solid rgba(255,249,237,0.35); display: flex; align-items: center; }
.day-bar:hover { filter: brightness(0.93); }
.now-line { position: absolute; left: 0; right: 0; height: 2px; background: rgba(168,80,60,0.7); z-index: 5; pointer-events: none; }
.now-line::before { content: ''; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: #a8503c; }
.empty-state { text-align: center; padding: 2rem; color: #947957; font-style: italic; font-size: 0.85rem; }
body.dark .empty-state { color: #b09a7a; }
.theme-toggle { position: fixed; top: 1rem; right: 1rem; z-index: 100; padding: 0.5rem 0.9rem; border-radius: 2rem; font-size: 0.75rem; }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle">🌙 深色</button>
<div class="app">
<div class="panel">
<h1>新增一日事件</h1>
<div class="form-row">
<div class="form-field"><label>事件標題</label><input type="text" id="evTitle" placeholder="輸入事件名稱..."></div>
<div class="form-field"><label>日期</label><input type="date" id="evDate"></div>
<div class="form-field"><label>開始時間</label><input type="time" id="evStartTime" value="09:00"></div>
<div class="form-field"><label>結束時間</label><input type="time" id="evEndTime" value="10:00"></div>
<div class="form-field" style="flex:0 0 90px;"><label>顏色</label><input type="color" id="evColor" value="#b9822e"></div>
</div>
<div class="btn-row">
<button class="primary" id="addBtn">新增事件</button>
<button class="danger" id="clearAllBtn">清空所有事件</button>
</div>
<div class="event-list" id="eventList"></div>
</div>

<div class="panel">
<h1>一日時間軸</h1>
<div class="day-toolbar">
<button class="nav-arrow" id="dayPrev">‹</button>
<span class="day-label" id="dayLabel"></span>
<button class="nav-arrow" id="dayNext">›</button>
<button class="btn-today" id="dayToday">今天</button>
</div>
<div class="day-grid-wrap">
<div class="day-grid">
<div class="hour-labels" id="hourLabels"></div>
<div class="hour-canvas" id="hourCanvas"></div>
</div>
</div>
</div>
</div>

<script>
(function() {
let events = [];
const STORAGE_KEY = 'day_timeline_events_v1';
let currentDate = new Date();

function loadEvents() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) events = JSON.parse(raw); } catch(e) { events = []; }
  events = events.map(ev => ({ ...ev, color: ev.color || '#b9822e' }));
}
function saveEvents() { localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); }
function generateId() { return Date.now() + Math.random().toString(36).substring(2, 9); }
function dateKey(d) { const dt = new Date(d); return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0'); }
function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }
function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text == null ? '' : text; return div.innerHTML; }
function getContrastText(hex) {
  if (!hex || hex.charAt(0) !== '#') return '#fff9ed';
  const c = hex.substring(1);
  const full = c.length === 3 ? c.split('').map(x => x + x).join('') : c;
  const r = parseInt(full.substr(0, 2), 16);
  const g = parseInt(full.substr(2, 2), 16);
  const b = parseInt(full.substr(4, 2), 16);
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminance > 0.6 ? '#3a2a14' : '#fff9ed';
}
function timeToMinutes(t) {
  if (!t) return 0;
  const parts = t.split(':');
  return parseInt(parts[0], 10) * 60 + (parseInt(parts[1], 10) || 0);
}

window.deleteEvent = function(id) { events = events.filter(ev => ev.id !== id); saveEvents(); renderAll(); };
window.startEdit = function(id) { editingId = id; renderEventList(); };
window.cancelEdit = function() { editingId = null; renderEventList(); };
let editingId = null;
window.saveEdit = function(id) {
  const item = document.querySelector('.event-item[data-id="' + id + '"]');
  if (!item) return;
  const title = item.querySelector('.edit-title').value.trim();
  const date = item.querySelector('.edit-date').value;
  const st = item.querySelector('.edit-start').value;
  const et = item.querySelector('.edit-end').value;
  const color = item.querySelector('.edit-color').value || '#b9822e';
  if (!title) { alert('請輸入事件標題'); return; }
  if (!date || !st || !et) { alert('請輸入日期與時間'); return; }
  if (timeToMinutes(st) >= timeToMinutes(et)) { alert('結束時間必須晚於開始時間'); return; }
  const ev = events.find(e => e.id === id);
  if (!ev) return;
  ev.title = title; ev.date = date; ev.startTime = st; ev.endTime = et; ev.color = color;
  editingId = null;
  saveEvents();
  renderAll();
};

function renderEventList() {
  const container = document.getElementById('eventList');
  if (events.length === 0) { container.innerHTML = '<div class="empty-state">尚未新增任何事件。</div>'; return; }
  const sorted = events.slice().sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    return timeToMinutes(a.startTime) - timeToMinutes(b.startTime);
  });
  let html = '';
  sorted.forEach(ev => {
    const color = ev.color || '#b9822e';
    if (ev.id === editingId) {
      html += `<div class="event-item editing" data-id="${ev.id}" style="border-left-color:${color};">
        <div class="ev-edit-row">
          <input class="ev-edit-input edit-title" type="text" value="${escapeHtml(ev.title)}" placeholder="事件名稱" style="flex:1 1 140px;">
          <input class="ev-edit-input edit-date" type="date" value="${ev.date || ''}">
          <input class="ev-edit-input edit-start" type="time" value="${ev.startTime || '09:00'}">
          <input class="ev-edit-input edit-end" type="time" value="${ev.endTime || '10:00'}">
          <input class="ev-edit-input edit-color" type="color" value="${color}">
          <button class="primary" onclick="window.saveEdit('${ev.id}')">儲存</button>
          <button onclick="window.cancelEdit()">取消</button>
        </div>
      </div>`;
    } else {
      html += `<div class="event-item" data-id="${ev.id}" style="border-left-color:${color};">
        <span class="ev-color-dot" style="background:${color};"></span>
        <span class="ev-title">${escapeHtml(ev.title)}</span>
        <span class="ev-dates">${ev.date} ${ev.startTime} – ${ev.endTime}</span>
        <button onclick="window.startEdit('${ev.id}')">編輯</button>
        <button class="danger" onclick="window.deleteEvent('${ev.id}')">刪除</button>
      </div>`;
    }
  });
  container.innerHTML = html;
}

function addEvent() {
  const title = document.getElementById('evTitle').value.trim();
  const date = document.getElementById('evDate').value;
  const st = document.getElementById('evStartTime').value;
  const et = document.getElementById('evEndTime').value;
  const color = document.getElementById('evColor').value || '#b9822e';
  if (!title) { alert('請輸入事件標題'); return; }
  if (!date || !st || !et) { alert('請輸入日期與時間'); return; }
  if (timeToMinutes(st) >= timeToMinutes(et)) { alert('結束時間必須晚於開始時間'); return; }
  events.push({ id: generateId(), title, date, startTime: st, endTime: et, color });
  saveEvents();
  document.getElementById('evTitle').value = '';
  renderAll();
}

function renderHourLabels() {
  const labels = document.getElementById('hourLabels');
  let html = '';
  for (let h = 0; h < 24; h++) {
    html += '<div class="hour-label">' + String(h).padStart(2,'0') + ':00</div>';
  }
  labels.innerHTML = html;
}

function renderDayTimeline() {
  const canvas = document.getElementById('hourCanvas');
  const key = dateKey(currentDate);
  const label = document.getElementById('dayLabel');
  const weekNames = ['日','一','二','三','四','五','六'];
  label.textContent = `${currentDate.getFullYear()}年${currentDate.getMonth()+1}月${currentDate.getDate()}日（${weekNames[currentDate.getDay()]}）`;

  const HOUR_PX = 42;
  let html = '';
  for (let h = 0; h < 24; h++) {
    html += '<div class="hour-line ' + (h % 6 === 0 ? 'major' : '') + '" style="top:' + (h * HOUR_PX) + 'px;"></div>';
  }
  const dayEvents = events.filter(ev => ev.date === key);
  dayEvents.forEach(ev => {
    const startMin = timeToMinutes(ev.startTime);
    const endMin = timeToMinutes(ev.endTime);
    if (endMin <= startMin) return;
    const top = (startMin / 60) * HOUR_PX;
    const height = ((endMin - startMin) / 60) * HOUR_PX;
    const bg = ev.color || '#b9822e';
    const fg = getContrastText(bg);
    html += '<div class="day-bar" style="top:' + top + 'px; height:' + Math.max(height, 18) + 'px; background:' + bg + '; color:' + fg + ';">' + escapeHtml(ev.title) + '</div>';
  });
  if (key === dateKey(new Date())) {
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const top = (nowMin / 60) * HOUR_PX;
    html += '<div class="now-line" style="top:' + top + 'px;"></div>';
  }
  canvas.innerHTML = html;
  if (dayEvents.length === 0) {
    canvas.innerHTML += '<div class="empty-state" style="position:absolute;top:40%;left:0;right:0;">這天沒有事件</div>';
  }
}

function renderAll() { renderEventList(); renderDayTimeline(); }

document.getElementById('dayPrev').addEventListener('click', function() { currentDate = addDays(currentDate, -1); renderDayTimeline(); });
document.getElementById('dayNext').addEventListener('click', function() { currentDate = addDays(currentDate, 1); renderDayTimeline(); });
document.getElementById('dayToday').addEventListener('click', function() { currentDate = new Date(); renderDayTimeline(); });

document.getElementById('addBtn').addEventListener('click', addEvent);
document.getElementById('clearAllBtn').addEventListener('click', function() {
  if (events.length === 0) return;
  if (confirm('確定清空所有事件？')) { events = []; saveEvents(); renderAll(); }
});

function applyTheme(dark) {
  document.body.classList.toggle('dark', dark);
  document.getElementById('themeToggle').textContent = dark ? '☀️ 淺色' : '🌙 深色';
  localStorage.setItem('day_timeline_theme', dark ? 'dark' : 'light');
}
document.getElementById('themeToggle').addEventListener('click', function() {
  applyTheme(!document.body.classList.contains('dark'));
});
const savedTheme = localStorage.getItem('day_timeline_theme');
if (savedTheme === 'dark') applyTheme(true);

const todayStr = dateKey(new Date());
document.getElementById('evDate').value = todayStr;

loadEvents();
renderHourLabels();
renderAll();
})();
</script>
</body>
</html>
