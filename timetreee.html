<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>時間軸 · 多維度</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Noto Sans SC", "Noto Sans TC", "Microsoft YaHei", sans-serif; background: #f7eedc; color: #5b3d1d; min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem; transition: background .2s, color .2s; }
body.dark { background: #1e1a14; color: #e8dcc8; }
.app { max-width: 1200px; width: 100%; display: flex; flex-direction: column; gap: 2rem; }
.panel { background: rgba(255,249,237,0.85); backdrop-filter: blur(10px); border-radius: 12px; padding: 1.8rem 2rem; border: 1px solid rgba(178,133,69,0.3); box-shadow: 0 12px 35px rgba(105,72,31,0.08); transition: background .2s, border-color .2s; }
body.dark .panel { background: rgba(40,34,26,0.85); border-color: rgba(180,140,80,0.3); box-shadow: 0 12px 35px rgba(0,0,0,0.3); }
h1 { font-family: "Noto Serif TC", Georgia, serif; font-size: 1.6rem; font-weight: 600; letter-spacing: 0.1em; margin-bottom: 1.5rem; color: #5b3d1d; }
body.dark h1 { color: #e8dcc8; }
.form-row { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
.form-field { flex: 1 1 160px; display: flex; flex-direction: column; gap: 0.3rem; }
.form-field label { font-size: 0.7rem; letter-spacing: 0.15em; color: #947957; text-transform: uppercase; font-family: Georgia, serif; }
body.dark .form-field label { color: #b09a7a; }
.form-field input { padding: 0.55rem 0.8rem; border: 1px solid rgba(178,133,69,0.4); border-radius: 6px; background: rgba(255,249,237,0.9); font-family: "Noto Serif TC", serif; font-size: 0.85rem; color: #5b3d1d; outline: none; transition: background .2s, border-color .2s, color .2s; }
body.dark .form-field input { background: rgba(50,44,34,0.9); border-color: rgba(180,140,80,0.4); color: #e8dcc8; }
.form-field input:focus { border-color: #b9822e; box-shadow: 0 0 0 3px rgba(185,130,46,0.15); }
.form-field input[type="color"] { padding: 0.2rem; height: 2.4rem; cursor: pointer; }
.btn-row { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 0.5rem; }
button { padding: 0.55rem 1.4rem; border-radius: 2rem; font-family: "Noto Serif TC", serif; font-size: 0.8rem; letter-spacing: 0.06em; cursor: pointer; transition: 0.15s; border: 1px solid rgba(178,133,69,0.4); background: rgba(255,249,237,0.9); color: #6d5437; }
body.dark button { background: rgba(50,44,34,0.9); border-color: rgba(180,140,80,0.4); color: #d8c8a8; }
button.primary { background: rgba(221,184,108,0.35); border-color: rgba(185,130,46,0.6); color: #5b3d1d; font-weight: 600; }
body.dark button.primary { background: rgba(221,184,108,0.2); border-color: rgba(185,130,46,0.6); color: #f0e0c0; }
button.primary:hover { background: rgba(221,184,108,0.55); }
body.dark button.primary:hover { background: rgba(221,184,108,0.35); }
button.danger { border-color: rgba(168,80,60,0.35); color: #a8503c; }
body.dark button.danger { border-color: rgba(200,110,90,0.5); color: #e08060; }
button.danger:hover { background: rgba(168,80,60,0.1); border-color: #a8503c; }
body.dark button.danger:hover { background: rgba(168,80,60,0.2); }
button:hover { background: rgba(221,184,108,0.2); }
body.dark button:hover { background: rgba(221,184,108,0.15); }
.event-list { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 1rem; }
.event-item { display: flex; align-items: center; gap: 1rem; padding: 0.7rem 1rem; background: rgba(255,249,237,0.7); border-radius: 8px; border-left: 4px solid #b9822e; flex-wrap: wrap; transition: background .2s, border-color .2s; }
body.dark .event-item { background: rgba(50,44,34,0.7); }
.event-item.editing { background: rgba(221,184,108,0.15); }
body.dark .event-item.editing { background: rgba(221,184,108,0.1); }
.event-item .ev-color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.15); }
.event-item .ev-title { flex: 1 1 160px; font-size: 0.92rem; font-weight: 600; font-family: "Noto Serif TC", serif; }
.event-item .ev-dates { font-size: 0.72rem; color: #947957; font-family: Georgia, serif; letter-spacing: 0.04em; }
body.dark .event-item .ev-dates { color: #b09a7a; }
.event-item .ev-edit-input { padding: 0.35rem 0.6rem; border: 1px solid rgba(178,133,69,0.4); border-radius: 5px; background: rgba(255,249,237,0.95); font-family: "Noto Serif TC", serif; font-size: 0.8rem; color: #5b3d1d; outline: none; }
body.dark .event-item .ev-edit-input { background: rgba(50,44,34,0.95); border-color: rgba(180,140,80,0.4); color: #e8dcc8; }
.event-item .ev-edit-input:focus { border-color: #b9822e; box-shadow: 0 0 0 2px rgba(185,130,46,0.15); }
.event-item .ev-edit-input[type="color"] { padding: 0.1rem; width: 42px; height: 1.9rem; cursor: pointer; }
.event-item .ev-edit-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; width: 100%; }
.toolbar { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; }
.filter-label { font-size: 0.7rem; letter-spacing: 0.15em; color: #947957; text-transform: uppercase; font-family: Georgia, serif; }
body.dark .filter-label { color: #b09a7a; }
.custom-select { padding: 0.35rem 0.7rem; border-radius: 1.5rem; border: 1px solid rgba(178,133,69,0.4); background: rgba(255,249,237,0.9); font-family: "Noto Serif TC", serif; font-size: 0.75rem; color: #5b3d1d; outline: none; cursor: pointer; }
body.dark .custom-select { background: rgba(50,44,34,0.9); border-color: rgba(180,140,80,0.4); color: #e8dcc8; }
.toolbar-nav { display: flex; align-items: center; gap: 0.5rem; margin-left: auto; }
.nav-arrow { padding: 0.25rem 0.7rem; border-radius: 50%; font-size: 1rem; line-height: 1; }
.toolbar-date { font-family: Georgia, serif; font-size: 0.78rem; color: #5b3d1d; min-width: 220px; text-align: center; }
body.dark .toolbar-date { color: #e8dcc8; }
.btn-today { padding: 0.35rem 0.9rem; font-size: 0.72rem; }
.timeline-wrap { overflow-x: auto; padding-bottom: 0.5rem; }
.timeline-grid { display: grid; grid-template-columns: 70px 1fr; min-width: 700px; }
.time-header { grid-column: 1 / -1; display: grid; grid-template-columns: 70px 1fr; margin-bottom: 0.4rem; }
.time-header-cells { display: grid; gap: 0; }
.time-header-cell { text-align: center; font-size: 0.58rem; color: #947957; padding: 0.35rem 0; border-left: 1px solid rgba(133,91,39,0.15); font-family: Georgia, serif; overflow: hidden; }
body.dark .time-header-cell { color: #b09a7a; border-left-color: rgba(180,140,80,0.15); }
.time-header-cell .cell-label { display: block; font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
.time-header-cell .cell-sub { display: block; font-size: 0.5rem; opacity: 0.75; white-space: nowrap; }
.track-label { display: flex; align-items: center; padding: 0.6rem 0.5rem 0.6rem 0; font-family: "Noto Serif TC", serif; font-size: 0.75rem; font-weight: 600; color: #5b3d1d; border-bottom: 1px solid rgba(133,91,39,0.15); }
body.dark .track-label { color: #e8dcc8; border-bottom-color: rgba(180,140,80,0.15); }
.track-label .dot { width: 9px; height: 9px; border-radius: 50%; margin-right: 0.4rem; flex-shrink: 0; }
.track-bars { position: relative; border-bottom: 1px solid rgba(133,91,39,0.15); display: flex; flex-direction: column; padding: 0.3rem 0; min-height: 44px; }
body.dark .track-bars { border-bottom-color: rgba(180,140,80,0.15); }
.cell-grid { position: absolute; top: 0; bottom: 0; left: 0; right: 0; display: grid; pointer-events: none; z-index: 0; }
.cell-grid > div { border-left: 1px solid rgba(185,130,46,0.08); }
body.dark .cell-grid > div { border-left-color: rgba(180,140,80,0.08); }
.time-bar { position: relative; height: 26px; border-radius: 13px; margin: 2px 0; display: flex; align-items: center; padding: 0 0.7rem; font-size: 0.68rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; z-index: 2; font-family: "Noto Serif TC", serif; border: 1px solid rgba(255,249,237,0.3); box-shadow: 0 2px 6px rgba(105,72,31,0.15); }
.time-bar:hover { filter: brightness(0.92); }
.now-line { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(168,80,60,0.7); z-index: 3; pointer-events: none; }
.empty-state { text-align: center; padding: 1.5rem; color: #947957; font-style: italic; font-size: 0.82rem; }
body.dark .empty-state { color: #b09a7a; }
.theme-toggle { position: fixed; top: 1rem; right: 1rem; z-index: 100; padding: 0.5rem 0.9rem; border-radius: 2rem; font-size: 0.75rem; }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle">🌙 深色</button>
<div class="app">
<div class="panel">
<h1>新增事件</h1>
<div class="form-row">
<div class="form-field"><label>事件標題</label><input type="text" id="evTitle" placeholder="輸入事件名稱..."></div>
<div class="form-field"><label>開始</label><input type="datetime-local" id="evStart"></div>
<div class="form-field"><label>結束</label><input type="datetime-local" id="evEnd"></div>
<div class="form-field" style="flex:0 0 90px;"><label>顏色</label><input type="color" id="evColor" value="#b9822e"></div>
</div>
<div class="btn-row">
<button class="primary" id="addBtn">新增事件</button>
<button class="danger" id="clearAllBtn">清空所有事件</button>
</div>
<div class="event-list" id="eventList"></div>
</div>

<div class="panel">
<h1>時間軸</h1>
<div class="toolbar">
<span class="filter-label">範圍</span>
<select id="rangeSelect" class="custom-select">
<option value="1">1 小時</option>
<option value="3">3 小時</option>
<option value="6">6 小時</option>
<option value="12">12 小時</option>
<option value="24" selected>24 小時</option>
<option value="48">48 小時</option>
<option value="72">3 天</option>
<option value="168">1 週</option>
<option value="336">2 週</option>
<option value="720">1 個月</option>
<option value="2160">3 個月</option>
<option value="4320">半年</option>
<option value="8760">1 年</option>
</select>
<span class="filter-label">刻度</span>
<select id="tickSelect" class="custom-select">
<option value="15">15 分鐘</option>
<option value="30" selected>30 分鐘</option>
<option value="60">1 小時</option>
<option value="120">2 小時</option>
<option value="360">6 小時</option>
<option value="720">12 小時</option>
<option value="1440">1 天</option>
<option value="10080">1 週</option>
<option value="43200">1 個月</option>
</select>
<div class="toolbar-nav">
<button class="nav-arrow" id="tlPrev">‹</button>
<span class="toolbar-date" id="tlDateRange"></span>
<button class="nav-arrow" id="tlNext">›</button>
<button class="btn-today" id="tlToday">現在</button>
</div>
</div>
<div class="timeline-wrap">
<div class="timeline-grid" id="timelineGrid"></div>
</div>
</div>
</div>

<script>
(function() {
let events = [];
const STORAGE_KEY = 'range_timeline_events_v1';
let anchor = new Date();
let rangeHours = 24;
let tickMinutes = 30;

function loadEvents() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) events = JSON.parse(raw); } catch(e) { events = []; }
  events = events.map(ev => ({ ...ev, color: ev.color || '#b9822e' }));
}
function saveEvents() { localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); }
function generateId() { return Date.now() + Math.random().toString(36).substring(2, 9); }
function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text == null ? '' : text; return div.innerHTML; }
function getContrastText(hex) {
  if (!hex || hex.charAt(0) !== '#') return '#fff9ed';
  const c = hex.substring(1);
  const full = c.length === 3 ? c.split('').map(x => x + x).join('') : c;
  const r = parseInt(full.substr(0, 2), 16);
  const g = parseInt(full.substr(2, 2), 16);
  const b = parseInt(full.substr(4, 2), 16);
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminance > 0.6 ? '#3a2a14' : '#fff9ed';
}
function pad(n) { return String(n).padStart(2, '0'); }
function fmtDateTime(d) {
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtDateShort(d) {
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

let editingId = null;
window.deleteEvent = function(id) { events = events.filter(ev => ev.id !== id); saveEvents(); renderAll(); };
window.startEdit = function(id) { editingId = id; renderEventList(); };
window.cancelEdit = function() { editingId = null; renderEventList(); };
window.saveEdit = function(id) {
  const item = document.querySelector('.event-item[data-id="' + id + '"]');
  if (!item) return;
  const title = item.querySelector('.edit-title').value.trim();
  const start = item.querySelector('.edit-start').value;
  const end = item.querySelector('.edit-end').value;
  const color = item.querySelector('.edit-color').value || '#b9822e';
  if (!title) { alert('請輸入事件標題'); return; }
  if (!start || !end) { alert('請輸入開始與結束時間'); return; }
  if (new Date(start) >= new Date(end)) { alert('結束時間必須晚於開始時間'); return; }
  const ev = events.find(e => e.id === id);
  if (!ev) return;
  ev.title = title; ev.start = start; ev.end = end; ev.color = color;
  editingId = null;
  saveEvents();
  renderAll();
};

function renderEventList() {
  const container = document.getElementById('eventList');
  if (events.length === 0) { container.innerHTML = '<div class="empty-state">尚未新增任何事件。</div>'; return; }
  const sorted = events.slice().sort((a, b) => new Date(a.start) - new Date(b.start));
  let html = '';
  sorted.forEach(ev => {
    const color = ev.color || '#b9822e';
    if (ev.id === editingId) {
      html += `<div class="event-item editing" data-id="${ev.id}" style="border-left-color:${color};">
        <div class="ev-edit-row">
          <input class="ev-edit-input edit-title" type="text" value="${escapeHtml(ev.title)}" placeholder="事件名稱" style="flex:1 1 140px;">
          <input class="ev-edit-input edit-start" type="datetime-local" value="${ev.start || ''}">
          <input class="ev-edit-input edit-end" type="datetime-local" value="${ev.end || ''}">
          <input class="ev-edit-input edit-color" type="color" value="${color}">
          <button class="primary" onclick="window.saveEdit('${ev.id}')">儲存</button>
          <button onclick="window.cancelEdit()">取消</button>
        </div>
      </div>`;
    } else {
      html += `<div class="event-item" data-id="${ev.id}" style="border-left-color:${color};">
        <span class="ev-color-dot" style="background:${color};"></span>
        <span class="ev-title">${escapeHtml(ev.title)}</span>
        <span class="ev-dates">${ev.start.replace('T',' ')} → ${ev.end.replace('T',' ')}</span>
        <button onclick="window.startEdit('${ev.id}')">編輯</button>
        <button class="danger" onclick="window.deleteEvent('${ev.id}')">刪除</button>
      </div>`;
    }
  });
  container.innerHTML = html;
}

function addEvent() {
  const title = document.getElementById('evTitle').value.trim();
  const start = document.getElementById('evStart').value;
  const end = document.getElementById('evEnd').value;
  const color = document.getElementById('evColor').value || '#b9822e';
  if (!title) { alert('請輸入事件標題'); return; }
  if (!start || !end) { alert('請輸入開始與結束時間'); return; }
  if (new Date(start) >= new Date(end)) { alert('結束時間必須晚於開始時間'); return; }
  events.push({ id: generateId(), title, start, end, color });
  saveEvents();
  document.getElementById('evTitle').value = '';
  renderAll();
}

function getRangeStart() { return new Date(anchor); }
function getRangeEnd() { return new Date(anchor.getTime() + rangeHours * 3600 * 1000); }

function formatCellLabel(cellStart, tickMinutes) {
  if (tickMinutes >= 43200) {
    return { main: `${cellStart.getFullYear()}年${cellStart.getMonth()+1}月`, sub: '' };
  }
  if (tickMinutes >= 10080) {
    return { main: `${cellStart.getMonth()+1}/${cellStart.getDate()}`, sub: `第${Math.ceil(cellStart.getDate()/7)}週` };
  }
  if (tickMinutes >= 1440) {
    return { main: `${cellStart.getMonth()+1}/${cellStart.getDate()}`, sub: '' };
  }
  if (tickMinutes >= 60) {
    return { main: `${pad(cellStart.getHours())}:${pad(cellStart.getMinutes())}`, sub: `${cellStart.getMonth()+1}/${cellStart.getDate()}` };
  }
  return { main: `${pad(cellStart.getHours())}:${pad(cellStart.getMinutes())}`, sub: '' };
}

function buildTickCells() {
  const start = getRangeStart();
  const end = getRangeEnd();
  const cells = [];
  const stepMs = tickMinutes * 60 * 1000;
  let t = Math.floor(start.getTime() / stepMs) * stepMs;
  if (t < start.getTime()) t += stepMs;
  while (t < end.getTime()) {
    const cellStart = new Date(t);
    const cellEnd = new Date(Math.min(t + stepMs, end.getTime()));
    cells.push({ start: cellStart, end: cellEnd });
    t += stepMs;
  }
  return cells;
}

function renderTimeline() {
  const grid = document.getElementById('timelineGrid');
  const cells = buildTickCells();
  const start = getRangeStart();
  const end = getRangeEnd();
  const rangeMs = end.getTime() - start.getTime();
  if (cells.length === 0) { grid.innerHTML = '<div class="empty-state">無法顯示。</div>'; return; }
  document.getElementById('tlDateRange').textContent = `${fmtDateTime(start)} – ${fmtDateTime(end)}`;

  const showSub = tickMinutes >= 60 && tickMinutes < 10080;
  let html = '<div class="time-header"><div></div><div class="time-header-cells" style="grid-template-columns: repeat(' + cells.length + ', 1fr);">';
  cells.forEach(c => {
    const lbl = formatCellLabel(c.start, tickMinutes);
    html += '<div class="time-header-cell"><span class="cell-label">' + lbl.main + '</span>' + (showSub && lbl.sub ? '<span class="cell-sub">' + lbl.sub + '</span>' : '') + '</div>';
  });
  html += '</div></div>';

  html += '<div class="track-label"><span class="dot" style="background:#b9822e;"></span>事件</div>';
  html += '<div class="track-bars">';
  html += '<div class="cell-grid" style="grid-template-columns: repeat(' + cells.length + ', 1fr);">';
  cells.forEach(() => { html += '<div></div>'; });
  html += '</div>';

  const now = new Date();
  if (now >= start && now <= end) {
    const leftPct = ((now.getTime() - start.getTime()) / rangeMs) * 100;
    html += '<div class="now-line" style="left:' + leftPct + '%;"></div>';
  }

  const visible = [];
  events.forEach(ev => {
    const evStart = new Date(ev.start);
    const evEnd = new Date(ev.end);
    if (isNaN(evStart.getTime()) || isNaN(evEnd.getTime())) return;
    if (evEnd <= start || evStart >= end) return;
    const visStart = evStart < start ? start : evStart;
    const visEnd = evEnd > end ? end : evEnd;
    const leftPct = ((visStart.getTime() - start.getTime()) / rangeMs) * 100;
    const rightPct = ((visEnd.getTime() - start.getTime()) / rangeMs) * 100;
    visible.push({ ev, leftPct, rightPct });
  });

  if (visible.length === 0) {
    html += '<div class="empty-state" style="position:relative;z-index:2;">此範圍內沒有事件</div>';
  } else {
    html += '<div class="bars-layer" style="position:relative; z-index:2; min-height:' + (visible.length * 30 + 8) + 'px;">';
    visible.forEach((item, row) => {
      const top = row * 30 + 3;
      const bg = item.ev.color || '#b9822e';
      const fg = getContrastText(bg);
      const widthPct = Math.max(item.rightPct - item.leftPct, 0.4);
      html += '<div class="time-bar" style="position:absolute; top:' + top + 'px; left:' + item.leftPct + '%; width:' + widthPct + '%; background:' + bg + '; color:' + fg + ';">' + escapeHtml(item.ev.title) + '</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  grid.innerHTML = html;
}

function renderAll() { renderEventList(); renderTimeline(); }

document.getElementById('rangeSelect').addEventListener('change', function() {
  rangeHours = parseInt(this.value, 10) || 24;
  renderTimeline();
});
document.getElementById('tickSelect').addEventListener('change', function() {
  tickMinutes = parseInt(this.value, 10) || 30;
  renderTimeline();
});

document.getElementById('tlPrev').addEventListener('click', function() {
  const stepMs = tickMinutes * 60 * 1000;
  anchor = new Date(anchor.getTime() - stepMs);
  renderTimeline();
});
document.getElementById('tlNext').addEventListener('click', function() {
  const stepMs = tickMinutes * 60 * 1000;
  anchor = new Date(anchor.getTime() + stepMs);
  renderTimeline();
});
document.getElementById('tlToday').addEventListener('click', function() { anchor = new Date(); renderTimeline(); });

document.getElementById('addBtn').addEventListener('click', addEvent);
document.getElementById('clearAllBtn').addEventListener('click', function() {
  if (events.length === 0) return;
  if (confirm('確定清空所有事件？')) { events = []; saveEvents(); renderAll(); }
});

function applyTheme(dark) {
  document.body.classList.toggle('dark', dark);
  document.getElementById('themeToggle').textContent = dark ? '☀️ 淺色' : '🌙 深色';
  localStorage.setItem('range_timeline_theme', dark ? 'dark' : 'light');
}
document.getElementById('themeToggle').addEventListener('click', function() {
  applyTheme(!document.body.classList.contains('dark'));
});
const savedTheme = localStorage.getItem('range_timeline_theme');
if (savedTheme === 'dark') applyTheme(true);

const now = new Date();
now.setMinutes(Math.floor(now.getMinutes() / 30) * 30, 0, 0);
document.getElementById('evStart').value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
const endInit = new Date(now.getTime() + 3600 * 1000);
document.getElementById('evEnd').value = `${endInit.getFullYear()}-${pad(endInit.getMonth()+1)}-${pad(endInit.getDate())}T${pad(endInit.getHours())}:${pad(endInit.getMinutes())}`;

loadEvents();
renderAll();
})();
</script>
